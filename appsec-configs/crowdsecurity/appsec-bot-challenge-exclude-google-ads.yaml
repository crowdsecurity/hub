name: crowdsecurity/appsec-bot-challenge-exclude-google-ads
# Skip the challenge for verified Google ad crawlers (matched against their published IP/rDNS ranges).
# Do not edit this file to add your own exclusions, create a custom config.
inband:
  pre_eval:
    - filter: MatchKnownBot(req.RemoteAddr, req.UserAgent(), req.URL.Path, "legit_bots/mediapartners-google.json")
      apply:
        - ExemptFromChallenge("mediapartners-google")
    - filter: MatchKnownBot(req.RemoteAddr, req.UserAgent(), req.URL.Path, "legit_bots/google-adsbot.json")
      apply:
        - ExemptFromChallenge("google-adsbot")

# Declares the datafiles so crowdsec downloads them.
data:
  - source_url: https://hub-data.crowdsec.net/whitelists/benign_bots/legit_bots/mediapartners-google.json
    dest_file: legit_bots/mediapartners-google.json
    type: bots
  - source_url: https://hub-data.crowdsec.net/whitelists/benign_bots/legit_bots/google-adsbot.json
    dest_file: legit_bots/google-adsbot.json
    type: bots
