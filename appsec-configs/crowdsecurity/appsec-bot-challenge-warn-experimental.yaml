name: crowdsecurity/appsec-bot-challenge-warn-experimental
# Generate an alert for analysis purpose without blocking the client
inband:
  on_challenge_submit:
    - filter: |
        "detect-experimental" in RequestScoreCategories() or
        "detect-experimental-codecs" in RequestScoreCategories() or
        "detect-experimental-cpu" in RequestScoreCategories() or
        "detect-experimental-fonts" in RequestScoreCategories() or
        "detect-experimental-form-factor" in RequestScoreCategories() or
        "detect-experimental-headers" in RequestScoreCategories()
      apply:
        - 'FlagSubmission(RequestScoreDetail(), "verbose")'
