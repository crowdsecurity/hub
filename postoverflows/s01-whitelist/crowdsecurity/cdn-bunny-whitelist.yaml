name: crowdsecurity/cdn-bunny-whitelist
description: "Whitelist CDN provider Bunny"
whitelist:
  reason: "CDN provider Bunny"
  expression:
    - "evt.Overflow.Alert.Source.IP in File('bunny_ips.txt')"
    - "evt.Overflow.Alert.Source.IP in File('bunny_ip6s.txt')"
data:
  - source_url: https://hub-data.crowdsec.net/whitelists/cdn_providers/bunny_ips.txt
    dest_file: bunny_ips.txt
    type: string
  - source_url: https://hub-data.crowdsec.net/whitelists/cdn_providers/bunny_ip6s.txt
    dest_file: bunny_ip6s.txt
    type: string
