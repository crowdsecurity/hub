name: Appsec Rules Tests
on:
  pull_request:
    branches: [ master ]
    paths:
      - 'appsec-configs/**.yaml'
      - 'appsec-configs/**.yml'
      - 'appsec-rules/**.yaml'
      - 'appsec-rules/**.yml'
      - '.github/workflows/test_appsec_rules.yaml'
      - '.appsec-tests/**'
  push:
    branches: [ master ]
    paths:
      - 'appsec-configs/**.yaml'
      - 'appsec-configs/**.yml'
      - 'appsec-rules/**.yaml'
      - 'appsec-rules/**.yml'
      - '.github/workflows/test_appsec_rules.yaml'
      - '.appsec-tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CROWDSEC_IMAGE: ghcr.io/crowdsecurity/crowdsec:dev
  NUCLEI_VERSION: "3.1.7"

jobs:
  run-appsec-rules-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Install nuclei
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/nuclei.zip \
          "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
        unzip -j -o /tmp/nuclei.zip nuclei -d /tmp/nuclei-bin
        chmod +x /tmp/nuclei-bin/nuclei
    - name: Start OpenResty Container
      run: |
        docker compose -f docker/appsec/docker-compose.yaml up -d --build
    - name: run tests with crowdsec from master branch
      run: |
        set -euo pipefail
        docker run --rm --network host \
          -v "$PWD:$PWD" -w "$PWD" \
          -v /tmp/nuclei-bin/nuclei:/usr/local/bin/nuclei:ro \
          --entrypoint bash "$CROWDSEC_IMAGE" -c '
            set -eu
            mkdir -p /etc/crowdsec && cp -r /staging/etc/* /etc/
            cscli hubtest run --all --appsec --target http://127.0.0.1:7822
          '
    - name: Compute appsec coverage
      run: |
        set -euo pipefail
        APPSEC_RULE_COV=$(docker run --rm \
          -v "$PWD:$PWD" -w "$PWD" \
          --entrypoint bash "$CROWDSEC_IMAGE" -c '
            { mkdir -p /etc/crowdsec && cp -r /staging/etc/* /etc/; } >&2
            cscli hubtest coverage --appsec --percent
          ' | cut -d '=' -f2)
        APPSEC_RULE_COV_NUMBER=$(echo "$APPSEC_RULE_COV" | tr -d '%' | tr -d '[:space:]')
        {
          echo "APPSEC_RULE_COV=$APPSEC_RULE_COV"
          echo "APPSEC_RULE_BADGE_COLOR=$(if [ "$APPSEC_RULE_COV_NUMBER" -lt "70" ]; then echo 'red'; else echo 'green'; fi)"
        } >> "$GITHUB_ENV"
    - name: Update appsec coverage badge
      if: ${{ github.ref == 'refs/heads/master' && github.repository_owner == 'crowdsecurity' }}
      env:
        GH_TOKEN: ${{ secrets.GIST_BADGES_SECRET }}
        GIST_ID: ${{ secrets.GIST_BADGES_ID }}
      run: |
        set -euo pipefail
        content=$(jq -cn --arg l 'Hub Appsec' --arg m "$APPSEC_RULE_COV" --arg c "$APPSEC_RULE_BADGE_COLOR" \
          '{schemaVersion:1,label:$l,message:$m,color:$c}')
        jq -n --arg c "$content" '{files:{"hub_appsec_badge.json":{content:$c}}}' \
          | gh api --method PATCH "/gists/${GIST_ID}" --input -
    - name: Stop containers
      if: always()
      run: docker compose -f docker/appsec/docker-compose.yaml down
