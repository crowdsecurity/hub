name: crowdsecurity/appsec-bot-challenge-permissive
# Permissive bot-challenge bundle: same building blocks as appsec-bot-challenge, but only rejects
# submissions scoring >= 100 (a near-certain automation signal). Minimises false positives.
parsers:
  - crowdsecurity/appsec-logs
  - crowdsecurity/appsec-bot-detection-logs
collections:
  - crowdsecurity/appsec-bot-challenge-scoring
  - crowdsecurity/appsec-bot-challenge-good-bots
  - crowdsecurity/appsec-bot-challenge-exclude-paths
appsec-configs:
  - crowdsecurity/appsec-bot-challenge-scoring-permissive
scenarios:
  - crowdsecurity/appsec-bot-challenge-too-many-requests
  - crowdsecurity/appsec-bot-challenge-too-many-submissions
contexts:
  - crowdsecurity/appsec_base
  - crowdsecurity/appsec-bot-detection
description: "WAF bot detection: challenge mode with weighted fingerprint scoring, rejecting at a permissive threshold (>= 100)"
labels:
  label: "WAF - Bot Challenge (permissive)"
author: crowdsecurity
tags:
  - waf
  - appsec
  - http
  - bot
