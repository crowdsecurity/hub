name: crowdsecurity/appsec-bot-challenge-detections-extra
# Detections held out of the default bundle because they are still experimental.
#
# detect-cpu-arch ships a WebAssembly module: it needs 'wasm-unsafe-eval' in
# the challenge CSP.
appsec-configs:
  - crowdsecurity/appsec-bot-challenge-detect-cpu-arch
  - crowdsecurity/appsec-bot-challenge-warn-experimental
description: "AppSec bot challenge: CPU architecture against the claimed platform (WebAssembly)"
labels:
  label: "WAF - Bot Challenge Detections (extra)"
author: crowdsecurity
tags:
  - waf
  - appsec
  - http
  - bot
