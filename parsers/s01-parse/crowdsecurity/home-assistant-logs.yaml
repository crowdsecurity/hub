onsuccess: next_stage
name: crowdsecurity/home-assistant-logs
description: "Parse Home Assistant logs"
filter: "evt.Parsed.program in ['home-assistant', 'hass'] or evt.Parsed.program endsWith 'homeassistant'"
nodes:
  - grok:
      pattern: "%{TIMESTAMP_ISO8601:timestamp} WARNING \\(%{DATA:threadName}\\) \\[homeassistant.components.http.ban\\] Login attempt or request with invalid authentication from %{DATA:source_rdns} \\(%{IPORHOST:source_ip}\\). \\(%{GREEDYDATA:http_user_agent}\\)"
      apply_on: message
      statics:
        - meta: log_type
          value: home-assistant_failed_auth
  - grok:
      pattern: "%{TIMESTAMP_ISO8601:timestamp} WARNING \\(%{DATA:threadName}\\) \\[homeassistant.components.http.ban\\] Login attempt or request with invalid authentication from %{DATA:source_rdns} \\(%{IPORHOST:source_ip}\\). Requested URL: '%{GREEDYDATA:url}'. \\(%{GREEDYDATA:http_user_agent}\\)"
      apply_on: message
      statics:
        - meta: log_type
          value: home-assistant_failed_auth
statics:
  - target: evt.StrTimeFormat
    value: "2006-01-02 15:04:05.000-07:00"
  - target: evt.StrTime
    expression: evt.Parsed.timestamp
  - meta: service
    value: http
  - meta: source_ip
    expression: "evt.Parsed.source_ip"
  - meta: source_rdns
    expression: "evt.Parsed.source_rdns"
