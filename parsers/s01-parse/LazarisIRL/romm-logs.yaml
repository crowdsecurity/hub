onsuccess: next_stage
filter: "evt.Parsed.program == 'romm'"
name: LazarisIRL/romm-logs
description: "Parse RomM Logs"
pattern_syntax:
  DATE_YMD: "%{YEAR:year}-%{MONTHNUM:month}-%{MONTHDAY:day}"
nodes:
  - grok:
      pattern: '^%{WORD:log_level}:\s+\[%{WORD:app}\]\[%{WORD:service}\]\[%{DATE_YMD:date} %{TIME:time}\]\s+%{IP:proxy_ip} \| %{IP:source_ip} \| %{WORD:http_method} /api/login (401|403|429) \|.*$'
      apply_on: message
      statics:
        - meta: log_type
          value: romm_failed_authentication
        - target: evt.Parsed.timestamp
          expression: "evt.Parsed.date + ' ' + evt.Parsed.time"
    onsuccess: next_stage
statics:
  - meta: service
    value: romm
  - meta: source_ip
    expression: "evt.Parsed.source_ip"
  - target: evt.StrTime
    expression: "evt.Parsed.timestamp"
