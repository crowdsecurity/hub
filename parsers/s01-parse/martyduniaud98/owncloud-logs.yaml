---
onsuccess: next_stage
filter: "Upper(evt.Parsed.program) == 'OWNCLOUD'"
name: martyduniaud98/owncloud-logs
description: "Parse owncloud logs"
nodes:
  - grok:
      # the username is free text: capture it up to the trailing "(Remote IP: ...)",
      # and never take the IP from the message (see source_ip below)
      pattern: '^Login failed: ''%{GREEDYDATA:target_user}'' \(Remote IP: ''%{IP}''\)$'
      expression: JsonExtract(evt.Parsed.message, "message")
    statics:
      - meta: target_user
        expression: "evt.Parsed.target_user"
      - meta: log_type
        value: owncloud_failed_auth
  - grok:
      pattern: 'Bruteforce attempt from \\?"%{IP:source_ip}\\?" detected for action \\?"%{DATA:action}\\?"'
      expression: JsonExtract(evt.Parsed.message, "message")
    statics:
      - meta: action
        expression: "evt.Parsed.action"
      - meta: log_type
        value: owncloud_bruteforce_attempt

  - grok:
      pattern: 'Trusted domain error. \\"%{IP:source_ip}\\".*'
      expression: JsonExtract(evt.Parsed.message, "message")
    statics:
      - meta: log_type
        value: owncloud_domain_error

statics:
  - meta: service
    value: owncloud
  # remoteAddr is the address ownCloud itself resolved for the request; the
  # message text can contain attacker-controlled data (e.g. the username)
  - meta: source_ip
    expression: JsonExtract(evt.Parsed.message, "remoteAddr")
  - target: evt.StrTime
    expression: JsonExtract(evt.Parsed.message, "time")
