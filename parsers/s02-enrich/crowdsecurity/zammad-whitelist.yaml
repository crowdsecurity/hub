name: crowdsecurity/zammad-whitelist
description: "Whitelist events from Zammad"
filter: "evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log']"
whitelist:
  reason: "Zammad Whitelist"
  expression:
   - evt.Meta.http_status == '200' && evt.Parsed.static_ressource == 'false' && evt.Meta.http_verb == 'GET' && evt.Parsed.request matches '^/api/v1/ticket_attachment/[0-9]+/[0-9]+/[0-9]+$'
   - evt.Meta.http_status == '403' && evt.Meta.http_verb == 'GET' && evt.Parsed.request matches '^/api/v1/ticket_attachment/[0-9]+/[0-9]+/[0-9]+$' && evt.Parsed.http_args == 'view=inline'
