type: leaky
name: Railline/axigen-auth-user-enum
description: "Detect rapid Axigen account enumeration from one source"
filter: "evt.Meta.log_type == 'axigen_failed_auth' && evt.Meta.source_ip != '' && evt.Meta.target_user != ''"
groupby: evt.Meta.source_ip
distinct: evt.Meta.target_user
leakspeed: 1m
capacity: 5
blackhole: 5m
reprocess: true
labels:
  service: axigen
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1589
  behavior: "generic:bruteforce"
  label: "Axigen User Enumeration"
  remediation: true
