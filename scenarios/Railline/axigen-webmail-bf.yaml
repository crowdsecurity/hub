type: leaky
name: Railline/axigen-webmail-bf
description: "Detect rapid WebMail login brute force against Axigen"
filter: "evt.Meta.log_type == 'axigen_webmail_auth' && evt.Meta.http_status == '401' && evt.Meta.source_ip != ''"
groupby: evt.Meta.source_ip
