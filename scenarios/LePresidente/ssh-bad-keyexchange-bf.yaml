# ssh bruteforce
type: leaky
name: lepresidente/ssh-bad-keyexchange-bf
description: "Detect ssh bad key exchange"
filter: "evt.Meta.log_type == 'ssh_bad_keyexchange'"
leakspeed: "10s"
references:
  - http://wikipedia.com/ssh-bf-is-bad
capacity: 5
groupby: evt.Meta.source_ip
blackhole: 1m
reprocess: true
labels:
  service: ssh
  behavior: "generic:scan"
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1595
  remediation: true
  label: "SSH Bad Key Exchange"
