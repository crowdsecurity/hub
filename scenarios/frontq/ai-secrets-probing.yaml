type: trigger
name: frontq/ai-secrets-probing
description: "Detect requests for AI assistant config and AI provider key files that no website serves"
filter: |
  evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log'] &&
  evt.Meta.http_path matches '(?i)(/[.](claude|cursor|codex|gemini|aider)(/|[.]|[?]|$)|/[.]mcp[.]json([?]|$)|/claude_desktop_config[.]json([?]|$)|/[.]dev[.]vars([?]|$)|/(aws-)?(bedrock|gemini|openai|azure-openai|vertex(-ai)?|google-ai|anthropic|mistral|groq|cohere)[-_](api-key|credentials)[.](config|json|ya?ml|txt)([?]|$))'
groupby: evt.Meta.source_ip
blackhole: 1m
labels:
  service: http
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1595.003
    - attack.T1552.001
  behavior: "http:scan"
  label: "AI Secrets Probing"
  remediation: true
