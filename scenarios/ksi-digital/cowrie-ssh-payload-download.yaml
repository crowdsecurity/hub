type: trigger
name: ksi-digital/cowrie-ssh-payload-download
description: "Detect file downloads, download attempts and SFTP/SCP uploads on a Cowrie honeypot over SSH"
filter: "evt.Meta.log_type in ['cowrie_session_file_download', 'cowrie_session_file_download_failed', 'cowrie_session_file_upload'] && evt.Meta.service == 'ssh'"
groupby: evt.Meta.source_ip
blackhole: 1h
labels:
  service: ssh
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1105
  behavior: "linux:post-exploitation"
  label: "Cowrie SSH Payload Transfer"
  remediation: true
