type: trigger
name: ksi-digital/cowrie-telnet-post-auth-commands
description: "Detect shell commands run on a Cowrie honeypot after a telnet login"
filter: "evt.Meta.log_type == 'cowrie_command_input' && evt.Meta.service == 'telnet'"
groupby: evt.Meta.source_ip
blackhole: 1h
labels:
  service: telnet
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1110
    - attack.T1059.004
  behavior: "telnet:bruteforce"
  label: "Cowrie Telnet Post-Login Commands"
  remediation: true
