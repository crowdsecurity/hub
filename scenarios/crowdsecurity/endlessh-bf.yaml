# endlessh bruteforce
type: leaky
name: crowdsecurity/endlessh-bf
description: "Detect SSH scanning caught by Endlessh"
filter: "evt.Meta.log_type == 'endlessh_accept'"
leakspeed: "5m"
references:
  - http://wikipedia.com/ssh-bf-is-bad
capacity: 5
groupby: evt.Meta.source_ip
blackhole: 120m
reprocess: true
labels:
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1595
  behavior: "generic:scan"
  label: "Endlessh SSH Scan"
  service: endlessh
  remediation: true
