name: crowdsecurity/vpatch-php-oom-nested-args
description: 'Vpatch for CVE-2026-109618 : block deeply nested body argument names, one of the OOM strategies used to corrupt request memory during startup.'
rules:
  - zones:
      - BODY_ARGS_NAMES
    transform:
      - lowercase
      - urldecode
    match:
      type: regex
      value: '(\[[^\]]*\]){10,}'

labels:
  type: exploit
  service: http
  confidence: 3
  spoofable: 0
  behavior: 'http:exploit'
  label: 'PHP - RCE'
  classification:
    - cve.CVE-2026-109618
    - cve.CVE-2026-109619
    - attack.T1190
    - cwe.CWE-1325
